name: Sync to CNB

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-cnb
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Sth32/GameDevSkills' || github.repository == 'Sth32/GameWorkbenchSkills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch GitHub branches and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c "http.extraHeader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" source.git
      - name: Push branches and tags to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if [ -z "$CNB_TOKEN" ]; then
            echo '::error::Repository secret CNB_TOKEN is missing.'
            exit 1
          fi
          git -C source.git \
            -c credential.helper= \
            -c 'credential.helper=!f() { printf "username=cnb\npassword=%s\n" "$CNB_TOKEN"; }; f' \
            push --atomic https://cnb.cool/qun-org/GameDevSkills.git \
            'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
